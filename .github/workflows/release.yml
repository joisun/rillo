name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm

      - name: Install development dependencies
        run: npm ci

      - name: Verify tag and project version
        run: |
          package_version="$(node -p 'require("./package.json").version')"
          test "$GITHUB_REF_NAME" = "v$package_version"

      - name: Build and test
        run: |
          npm run build
          npm run build:adapters
          npm run check
          npm test
          npm run test:ui -- --maxWorkers=2

      - name: Package release assets
        run: |
          npm run package:release
          cp install.sh release/install.sh
          chmod 755 release/install.sh
          cd release
          shasum -a 256 \
            rillo-macos.tar.gz \
            rillo-linux.tar.gz \
            rillo-codex-adapter.tar.gz \
            rillo-claude-adapter.tar.gz \
            install.sh > SHA256SUMS

      - name: Upload release assets for Linux verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-assets
          path: release/
          if-no-files-found: error
          retention-days: 1

  verify-linux:
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Download the exact macOS-built release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release/
      - name: Verify Linux installer and installed runtime
        run: bash scripts/verify-release-install.sh release "$GITHUB_REF_NAME"

  publish:
    needs: [release, verify-linux]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-assets
          path: release/
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            release/rillo-macos.tar.gz \
            release/rillo-linux.tar.gz \
            release/rillo-codex-adapter.tar.gz \
            release/rillo-claude-adapter.tar.gz \
            release/install.sh \
            release/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --title "Rillo $GITHUB_REF_NAME"
